name: Windows build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate build version
        id: version
        shell: pwsh
        run: |
          $stamp = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(8)).ToString('yy.MM.dd.HH.mm', [Globalization.CultureInfo]::InvariantCulture)
          $version = "v1.$stamp"
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=CakePet_winx64-$version-gt" >> $env:GITHUB_OUTPUT
          "CAKEPET_BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - name: Copy original tray icon asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/CakePet.Windows/Assets | Out-Null
          Copy-Item -LiteralPath "assets/default/安静/sit_clam-1.png" -Destination src/CakePet.Windows/Assets/tray.png
          if ((git hash-object "assets/default/安静/sit_clam-1.png") -ne (git hash-object src/CakePet.Windows/Assets/tray.png)) { throw 'Tray asset copy mismatch' }
          & .github/scripts/New-AppIcon.ps1 -Source src/CakePet.Windows/Assets/tray.png -Destination src/CakePet.Windows/Assets/CakePet.ico
      - name: Core tests
        shell: pwsh
        run: dotnet run --project tests/CakePet.Core.Tests -c Release -- "assets/default"
      - name: Verify Windows image decoding
        shell: pwsh
        run: |
          dotnet run --project src/CakePet.Windows -c Release -- --validate-assets "assets/default"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile production native host
        shell: pwsh
        run: dotnet build src/CakePet.Host -c Release
      - name: Compile native host experiment
        shell: pwsh
        run: dotnet build tests/CakePet.NativeProbe -c Release
      - name: Compare host memory
        shell: pwsh
        continue-on-error: true
        run: |
          & .github/scripts/Measure-Host.ps1 -Package "assets/default"
      - name: Publish JIT comparison host
        shell: pwsh
        run: |
          dotnet publish src/CakePet.Host -c Release -r win-x64 --self-contained true -p:PublishAot=false -o artifacts/host-jit "-p:InformationalVersion=$env:CAKEPET_BUILD_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish desktop executable
        shell: pwsh
        run: |
          dotnet publish src/CakePet.Host -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:StripSymbols=true -o artifacts/CakePet "-p:InformationalVersion=$env:CAKEPET_BUILD_VERSION" -p:IncludeSourceRevisionInInformationalVersion=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/CakePet.Windows -c Release -r win-x64 --self-contained true -o artifacts/CakePet/settings "-p:InformationalVersion=$env:CAKEPET_BUILD_VERSION" -p:IncludeSourceRevisionInInformationalVersion=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path artifacts/CakePet/assets | Out-Null
          Copy-Item -LiteralPath src/CakePet.Windows/Assets/tray.png -Destination artifacts/CakePet/assets/tray.png
          Copy-Item -LiteralPath src/CakePet.Windows/Assets/CakePet.ico -Destination artifacts/CakePet/assets/CakePet.ico
          git rev-parse HEAD:assets/default | Set-Content -Encoding utf8 artifacts/CakePet/assets/windows-source.txt
          $folder = 'artifacts/CakePet'
          foreach ($dir in (Get-ChildItem $folder -Directory)) {
            if ($dir.Name -notin @('zh-Hans','zh-Hant','en','assets','settings') -and ($dir.Name -match '^[a-z]{2}(-[A-Za-z]+)?$')) { Remove-Item $dir.FullName -Recurse -Force }
          }
          if (!(Test-Path "$folder/CakePet.exe") -or !(Test-Path "$folder/settings/CakePet.exe") -or !(Test-Path "$folder/assets/default/modes.jsonc")) { throw "Incomplete publish: $folder" }
          if (Test-Path "$folder/coreclr.dll") { throw "Resident package still contains CoreCLR" }
          $files = Get-ChildItem $folder -Recurse -File
          Write-Host "$folder : $($files.Count) files, $([Math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB, 2)) MiB"
      - name: Compare production JIT and Native AOT
        shell: pwsh
        run: |
          & .github/scripts/Compare-Framework.ps1 -Jit artifacts/host-jit/CakePet.exe -Aot artifacts/CakePet/CakePet.exe -Package "assets/default"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-comparison-${{ steps.version.outputs.version }}
          path: artifacts/framework-report
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: artifacts/CakePet
