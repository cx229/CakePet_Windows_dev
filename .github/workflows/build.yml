name: Windows build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/checkout@v4
        with:
          repository: cx229/CakePet_Android_dev
          ref: 8ccf31b3a4427e143d2ab106b85f7f9833482479
          path: android-reference
      - name: Generate build version
        id: version
        shell: pwsh
        run: |
          $stamp = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(8)).ToString('yy.MM.dd.HH.mm', [Globalization.CultureInfo]::InvariantCulture)
          $version = "v1.$stamp"
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=CakePet_winx64-$version-gt" >> $env:GITHUB_OUTPUT
          "CAKEPET_BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - name: Copy original tray icon asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/CakePet.Windows/Assets | Out-Null
          Copy-Item -LiteralPath "android-reference/app/src/main/assets/白酥/安静/sit_clam-1.png" -Destination src/CakePet.Windows/Assets/tray.png
          if ((git -C android-reference hash-object "app/src/main/assets/白酥/安静/sit_clam-1.png") -ne (git hash-object src/CakePet.Windows/Assets/tray.png)) { throw 'Tray asset copy mismatch' }
          & .github/scripts/New-AppIcon.ps1 -Source src/CakePet.Windows/Assets/tray.png -Destination src/CakePet.Windows/Assets/CakePet.ico
      - name: Core tests
        shell: pwsh
        run: dotnet run --project tests/CakePet.Core.Tests -c Release -- "android-reference/app/src/main/assets/白酥"
      - name: Verify Windows image decoding
        shell: pwsh
        run: |
          dotnet run --project src/CakePet.Windows -c Release -- --validate-assets "android-reference/app/src/main/assets/白酥"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish desktop executable
        shell: pwsh
        run: |
          dotnet publish src/CakePet.Windows -c Release -r win-x64 --self-contained true -o artifacts/CakePet "-p:InformationalVersion=$env:CAKEPET_BUILD_VERSION" -p:IncludeSourceRevisionInInformationalVersion=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path artifacts/CakePet/assets | Out-Null
          Copy-Item -Recurse -LiteralPath "android-reference/app/src/main/assets/白酥" -Destination artifacts/CakePet/assets/default
          Copy-Item -LiteralPath src/CakePet.Windows/Assets/tray.png -Destination artifacts/CakePet/assets/tray.png
          Copy-Item -LiteralPath src/CakePet.Windows/Assets/CakePet.ico -Destination artifacts/CakePet/assets/CakePet.ico
          git -C android-reference rev-parse HEAD | Set-Content -Encoding utf8 artifacts/CakePet/assets/android-source.txt
          dotnet publish src/CakePet.Windows -c Release -r win-x64 --self-contained false -o artifacts/CakePet-lite "-p:InformationalVersion=$env:CAKEPET_BUILD_VERSION" -p:IncludeSourceRevisionInInformationalVersion=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Recurse -LiteralPath artifacts/CakePet/assets -Destination artifacts/CakePet-lite/assets
          @'
          此版本需要 Microsoft .NET 10 Desktop Runtime (x64)。
          下载：https://dotnet.microsoft.com/download/dotnet/10.0
          如果不想安装运行库，请下载同版本的完整包。
          '@ | Set-Content -Encoding utf8 artifacts/CakePet-lite/运行说明.txt
          foreach ($folder in @('artifacts/CakePet','artifacts/CakePet-lite')) {
            $files = Get-ChildItem $folder -Recurse -File
            Write-Host "$folder : $($files.Count) files, $([Math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB, 2)) MiB"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: artifacts/CakePet
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}-lite
          path: artifacts/CakePet-lite
